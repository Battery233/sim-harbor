services:
  sim:
    build: .
    image: ${SIM_IMAGE:-sim-harbor:1.1.1-rc.4}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
    environment:
      SIM_ADMIN_TOKEN: ${SIM_ADMIN_TOKEN:?Set the private admin token}
      SIM_AES_KEY: ${SIM_AES_KEY:?Set the 16-byte AES key}
      SIM_AES_IV: ${SIM_AES_IV:?Set the 16-byte AES IV}
      SIM_BARK_KEY: ${SIM_BARK_KEY:-}
    ports:
      - "127.0.0.1:${SIM_HTTP_PORT:-8080}:8080"
      - "${SIM_DEVICE_BIND:-127.0.0.1}:${SIM_DEVICE_PORT:-9000}:9000"
    volumes:
      - type: bind
        source: ${SIM_CONFIG:-./configs/container.private.json}
        target: /config/runtime.json
        read_only: true
        bind:
          create_host_path: false
      - sim-data:/data
    healthcheck:
      test: [CMD, /app/sim-check, -config, /config/runtime.json]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  sim-data:
