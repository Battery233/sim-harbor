name: Release image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Validate release version
        id: release
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          grep -Fq "const Version = \"$release_version\"" internal/version/version.go
          test "$(node -p "require('./web/package.json').version")" = "$release_version"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build an amd64 image for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: sim-harbor:verify
          cache-from: type=gha
      - name: Verify isolated container startup
        shell: bash
        run: |
          trap 'docker rm -f sim-harbor-release-check >/dev/null 2>&1 || true' EXIT
          docker run -d --name sim-harbor-release-check --network none --read-only \
            --tmpfs /data:rw,uid=65532,gid=65532,mode=0700 \
            --mount type=bind,src="$PWD/configs/container.example.json",dst=/config/runtime.json,readonly \
            -e SIM_ADMIN_TOKEN=SYNTHETIC-RELEASE-TEST-TOKEN-ONLY \
            -e SIM_AES_KEY=0123456789abcdef -e SIM_AES_IV=fedcba9876543210 \
            sim-harbor:verify
          for attempt in $(seq 1 30); do
            if docker exec sim-harbor-release-check /app/sim-check -config /config/runtime.json; then break; fi
            sleep 2
          done
          docker exec sim-harbor-release-check /app/sim-check -config /config/runtime.json
      - name: Publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
